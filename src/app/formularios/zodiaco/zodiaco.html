<div style="display: flex; justify-content: space-around; align-items: center; padding: 20px;">
  
  <div>
    <h2>Datos Personales</h2>
    
    <form [formGroup]="formulario" (ngSubmit)="imprimir()">
      
      <p>
        <label>Nombre:</label>
        <input type="text" formControlName="nombre">
      </p>
      
      <p>
        <label>Apaterno:</label>
        <input type="text" formControlName="apaterno">
      </p>
      
      <p>
        <label>Amaterno:</label>
        <input type="text" formControlName="amaterno">
      </p>

      <p>
        <label>Fecha de nacimiento:</label><br>
        <input type="number" formControlName="dia"  style="width: 50px;">
        <input type="number" formControlName="mes"  style="width: 50px;">
        <input type="number" formControlName="anio"  style="width: 60px;">
      </p>

      <p>
        <label>Sexo:</label><br>
        <input type="radio" formControlName="sexo" value="Masculino"> Masculino
        <input type="radio" formControlName="sexo" value="Femenino"> Femenino
      </p>

      <button type="submit">Imprimir</button>
    </form>
  </div>

  <div style="border-left: 2px solid black; height: 300px;"></div>

  <div style="text-align: center; min-width: 250px;">
    
    <div *ngIf="signo">
      <h2>Hola <i>{{ nombreCompleto }}</i></h2>
      <p>Tienes <b>{{ edad }}</b> años</p>
      <p>tu signo zodiacal</p>
      <h2>Es {{ signo }}</h2>
      
      <div style="background-color: blue; border-radius: 50%; width: 100px; height: 100px; margin: auto; display: flex; align-items: center; justify-content: center;">
        <img [src]="imagenSigno" alt="Animal" style="width: 60px; filter: invert(1);">
      </div>
    </div>

  </div>

</div>
